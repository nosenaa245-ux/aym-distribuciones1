    <script type="text/javascript">
      // Soporte para rutas SPA en GitHub Pages (ej. usuario.github.io/repositorio)
      (function(l) {
        if (l.search) {
          var q = new URLSearchParams(l.search);
          if (q.has('p')) {
            var path = decodeURIComponent(q.get('p') || '');
            q.delete('p');
            var rest = q.toString();
            var newUrl = l.pathname.replace(/\/$/, '') + (path.startsWith('/') ? path : '/' + path) + (rest ? '?' + rest : '') + l.hash;
            window.history.replaceState(null, null, newUrl);
          }
        }
      })(window.location);
    </script>
